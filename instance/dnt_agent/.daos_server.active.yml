port: 10001
transport_config:
  allow_insecure: true
  client_cert_dir: /etc/daos/certs/clients
  ca_cert: /etc/daos/certs/daosCA.crt
  cert: /etc/daos/certs/server.crt
  key: /etc/daos/certs/server.key
engines:
- targets: 4
  nr_xs_helpers: 2
  first_core: 0
  log_file: /tmp/dnt_server.log
  storage:
  - class: ram
    scm_mount: /dev/shm/daos/
    scm_size: 6
  provider: ofi+tcp
  fabric_iface: lo
  fabric_iface_port: 31416
  env_vars:
  - DAOS_MD_CAP=1024
  - DAOS_TARGET_OVERSUBSCRIBE=1
  - DD_MASK=all
  - DD_SUBSYS=all
  - CRT_CTX_NUM=32
  - D_DOMAIN=lo
  - DAOS_STRICT_SHUTDOWN=1
  - ABT_STACK_OVERFLOW_CHECK=mprotect
  - D_LOG_MASK=DEBUG
  - D_LOG_SIZE=5g
  - FI_UNIVERSE_SIZE=128
disable_vfio: false
disable_vmd: false
enable_hotplug: false
nr_hugepages: 0
system_ram_reserved: 1
disable_hugepages: true
control_log_mask: DEBUG
control_log_file: /tmp/dnt_control.log
helper_log_file: /tmp/dnt_helper.log
core_dump_filter: 19
name: daos_server
socket_dir: /home/beside/work/daos-stack/daos/instance/dnt_agent/
provider: ofi+tcp
access_points:
- localhost:10001
fault_cb: ""
hyperthreads: false
